name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            desktop_app/requirements.txt
            desktop_app/requirements-dev.txt
      - name: Install development environment
        run: python desktop_app/manage.py setup --development
      - name: Run tests
        run: python desktop_app/manage.py test
